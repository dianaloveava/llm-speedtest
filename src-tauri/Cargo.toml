[package]
name = "llm-speedtest"
version = "1.0.0"
description = "LLM SpeedTest desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
